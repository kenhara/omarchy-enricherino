<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Yellow Pixels marketplace preview">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#ffdb47" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#desk)"/>
  <rect width="1200" height="760" fill="url(#glow)"/>
  <!-- bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#0e0e12" opacity="0.95"/>
  <text x="28" y="28" fill="#f0f0fa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="4" opacity="0.85">OMARCHY</text>
  <rect x="1040" y="10" width="132" height="24" rx="6" fill="rgba(240,240,250,0.08)"/>
  <text x="1056" y="27" fill="#ffdb47" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">●</text>
  <text x="1074" y="27" fill="#f0f0fa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">YP</text>
  <!-- panel -->
  <rect x="740" y="56" width="420" height="660" rx="16" fill="#121216" stroke="rgba(240,240,250,0.12)"/>
  <text x="768" y="100" fill="#ffdb47" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3.5">YELLOW PIXELS</text>
  <text x="768" y="126" fill="#f0f0fa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" opacity="0.5">look somebody up</text>
  <!-- paste -->
  <rect x="768" y="148" width="364" height="72" rx="10" fill="rgba(240,240,250,0.06)" stroke="rgba(240,240,250,0.14)"/>
  <text x="784" y="178" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">alex@example.com</text>
  <text x="784" y="204" fill="#f0f0fa" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.35">looks like an email</text>
  <!-- FIND -->
  <rect x="768" y="236" width="364" height="48" rx="10" fill="#ffdb47"/>
  <text x="920" y="267" fill="#15140c" font-size="15" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="3">FIND</text>
  <!-- contact card -->
  <rect x="768" y="304" width="364" height="360" rx="12" fill="rgba(240,240,250,0.05)" stroke="rgba(255,219,71,0.22)"/>
  <text x="788" y="340" fill="#f0f0fa" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Alex Example</text>
  <text x="788" y="366" fill="#f0f0fa" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.55">Product Manager · Example Corp</text>
  <line x1="788" y1="382" x2="1112" y2="382" stroke="rgba(240,240,250,0.1)"/>
  <text x="788" y="410" fill="#f0f0fa" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.38">Email</text>
  <text x="788" y="430" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">alex@example.com</text>
  <text x="788" y="460" fill="#f0f0fa" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.38">Phone</text>
  <text x="788" y="480" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">+1 415 555 0199</text>
  <text x="788" y="510" fill="#f0f0fa" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.38">LinkedIn</text>
  <text x="788" y="530" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">linkedin.com/in/alex</text>
  <text x="788" y="560" fill="#f0f0fa" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.38">X</text>
  <text x="788" y="580" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">x.com/alex</text>
  <rect x="788" y="600" width="324" height="34" rx="8" fill="rgba(255,219,71,0.16)" stroke="rgba(255,219,71,0.4)"/>
  <text x="900" y="622" fill="#f0f0fa" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Copy card</text>
  <text x="768" y="692" fill="#f0f0fa" font-size="10" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.28">unofficial · waterfall under the hood · not a sequencer</text>
  <!-- left caption -->
  <text x="64" y="360" fill="#f0f0fa" font-size="42" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" opacity="0.9">Yellow</text>
  <text x="64" y="412" fill="#ffdb47" font-size="42" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Pixels</text>
  <text x="64" y="456" fill="#f0f0fa" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.5">one paste · FIND · contact card</text>
  <text x="64" y="490" fill="#f0f0fa" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" opacity="0.35">v0.2.0 · look somebody up</text>
</svg>
